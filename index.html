<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>luka.wang</title>
  <style>
    /* Light: Linen background, Forest frame. Dark: Forest background, Black frame. */
    :root {
      --bg: #f4efe7;
      --ink: #2a241f;
      --mat: #2f3d32;
      --edge: #1f2a22;
      --shadow: rgba(60, 40, 20, 0.18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #2f3d32;
        --ink: #eef0ea;
        --mat: #1b1816;
        --edge: #000000;
        --shadow: rgba(0, 0, 0, 0.45);
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 16px;
      background: var(--bg);
    }
    figure {
      display: grid;
      justify-items: center;
      gap: 18px;
      margin: 0;
      max-width: 100%;
    }
    img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 50vh;
      max-height: 50dvh;
      padding: clamp(8px, 1.6vmin, 14px);
      background: var(--mat);
      border: 1px solid var(--edge);
      border-radius: 6px;
      box-shadow:
        0 1px 2px var(--shadow),
        0 12px 32px -8px var(--shadow);
    }
    figcaption {
      color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-size: clamp(1.4rem, 3.2vmin, 1.9rem);
      font-style: italic;
      letter-spacing: 0.02em;
      line-height: 1;
    }
  </style>
</head>
<body>
  <figure>
    <img src="IMG_8405.jpg" width="1706" height="2048"
         alt="A tabby kitten peeking out of a hole carved in a large orange pumpkin">
    <figcaption>Luka</figcaption>
  </figure>
</body>
</html>
